# Zig: the lexer of Zig 0.17.0's std.zig.Tokenizer (lib/std/zig/tokenizer.zig)
# as Nexus rules, token for token. The cases are hand-written; cases/tokens/
# start at parseTokens and print each token in a node named by its category
# (std.zig.Token.Tag's name, or the lang Lexer's). known/tokens/ holds a
# token over 65535 bytes, the most a Nexus token holds. tokens_test.zig
# compares the lexer with the std.zig.Tokenizer of the Zig running the suite
# (which must be 0.17.0); compare-tokens runs that comparison over a corpus.
