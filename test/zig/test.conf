# Zig: the lexer of Zig 0.17.0's std.zig.Tokenizer (lib/std/zig/tokenizer.zig)
# as Nexus rules, token for token, and a parser for all of Zig's syntax.
# The cases are hand-written: cases/*.zig parse whole files from `root`
# (the reject_* cases are inputs Ast.parse rejects: operator spacing, `&&`,
# chained comparisons, doc comment placement, ...);
# cases/tokens/ start at parseTokens and print each token in a node named
# by its category (std.zig.Token.Tag's name, or the lang Lexer's).
# known/ and known/tokens/ hold a token over 65535 bytes, the most a Nexus
# token holds. tokens_test.zig compares the lexer with the std.zig.Tokenizer
# of the Zig running the suite (which must be 0.17.0), trees_test.zig the
# trees with std.zig.Ast's, and messages_test.zig pins the wording of
# syntax errors (@display, @errors); compare-tokens runs
# that comparison over a corpus, compare-accept compares what the parser
# accepts with std.zig.Ast.parse, and compare-trees the trees it builds
# with std.zig.Ast's.
